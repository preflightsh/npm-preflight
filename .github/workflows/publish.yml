name: Publish to npm

on:
  repository_dispatch:
    types: [publish]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships 10.x.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Update version and publish
        run: |
          VERSION=${{ github.event.client_payload.version }}
          if npm view "@preflightsh/preflight@$VERSION" version > /dev/null 2>&1; then
            echo "@preflightsh/preflight@$VERSION is already published; nothing to do."
            exit 0
          fi
          npm version $VERSION --no-git-tag-version
          npm publish --provenance --access public
